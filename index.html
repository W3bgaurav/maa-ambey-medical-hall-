<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mambe Medical Hall</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f1f5f9;
    color: #1e293b;
}

header {
    background: #087f5b;
    color: white;
    text-align: center;
    padding: 22px 10px;
}

header h1 {
    margin: 0;
}

main {
    max-width: 900px;
    margin: 20px auto;
    padding: 15px;
}

.card {
    background: white;
    padding: 18px;
    margin-bottom: 18px;
    border-radius: 10px;
    box-shadow: 0 2px 8px #00000012;
}

input, button {
    padding: 11px;
    margin: 5px 0;
    border-radius: 5px;
    border: 1px solid #cbd5e1;
    font-size: 15px;
}

input {
    width: 100%;
}

button {
    background: #087f5b;
    color: white;
    border: none;
    cursor: pointer;
}

button:hover {
    background: #066747;
}

.medicine {
    border-bottom: 1px solid #e2e8f0;
    padding: 12px 0;
}

.total {
    font-size: 22px;
    font-weight: bold;
}

.note {
    font-size: 13px;
    color: #64748b;
}

@media print {
    header, .no-print, .note {
        display: none;
    }

    body {
        background: white;
    }

    .card {
        box-shadow: none;
    }
}
</style>
</head>

<body>

<header>
    <h1>💊 Mambe Medical Hall</h1>
    <p>Medicine Billing & Inventory Demo</p>
</header>

<main>

<section class="card">
    <h2>➕ Add Medicine</h2>

    <input id="name" placeholder="Medicine Name">
    <input id="batch" placeholder="Batch Number">
    <input id="manufacturer" placeholder="Manufacturer">
    <label for="expiry">Expiry Month:</label>
    <input id="expiry" type="month">

    <input id="mrp" type="number" min="0.01"
           step="0.01" placeholder="MRP per unit">

    <input id="price" type="number" min="0.01"
           step="0.01" placeholder="Selling Price per unit">

    <input id="qty" type="number" min="1"
           step="1" placeholder="Stock Quantity">

    <button onclick="addMedicine()">Add to Inventory</button>
</section>

<section class="card">
    <h2>📦 Medicine Inventory</h2>

    <input id="search"
           placeholder="Search medicine..."
           oninput="showInventory()">

    <div id="inventory"></div>
</section>

<section class="card">
    <h2>🧾 Customer Bill</h2>

    <div id="bill"></div>

    <p class="total">
        Total: ₹<span id="total">0.00</span>
    </p>

    <button class="no-print" onclick="printBill()">
        Print Bill & Update Stock
    </button>

    <button class="no-print" onclick="clearBill()">
        Clear Bill
    </button>
</section>

<p class="note">
    Demo only. Data is saved in this browser on this device.
    This is not a production-ready pharmacy billing system.
</p>

</main>

let medicines = JSON.parse(
    localStorage.getItem("mambe_medicines") || "[]"
);

    localStorage.setItem(
        "mambe_medicines",
        JSON.stringify(medicines)
    );
}
